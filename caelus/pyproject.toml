[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caelus"
version = "0.1.0"
description = "Caelus v1 – coherence-first Noetican cognition core"
requires-python = ">=3.11"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
dependencies = [
  "numpy>=1.24,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
caelus = "caelus.cli.main:main"
caelus-coherence = "caelus.cli.coherence:main"

[tool.setuptools.packages.find]
include = ["caelus*"]
